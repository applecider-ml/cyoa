[package]
name = "boom-fit-batch"
version = "0.1.0"
edition = "2021"

[dependencies]
lightcurve-fitting = { git = "https://github.com/boom-astro/lightcurve-fitting" }
ndarray = "0.16.1"
ndarray-npy = { version = "0.9", features = ["npz"] }
serde_json = "1.0"
csv = "1.3"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"

[profile.release]
opt-level = 3
lto = true
